name: Documentation Link Validation

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/Ensure-PublishedHtmlMetadata.ps1'
      - 'scripts/Validate-LandingPage.ps1'
      - 'lychee.toml'
      - '.config/dotnet-tools.json'
      - '.github/workflows/link-validation.yml'

  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/Ensure-PublishedHtmlMetadata.ps1'
      - 'scripts/Validate-LandingPage.ps1'
      - 'lychee.toml'
      - '.config/dotnet-tools.json'
      - '.github/workflows/link-validation.yml'

  # Detect external link rot even when documentation has not changed.
  schedule:
    - cron: '41 13 * * 0'

permissions: {}

concurrency:
  group: documentation-link-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: Release
  SOLUTION_FILE: './ReferenceApplication.slnx'

jobs:
  validate-links:
    name: Validate documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }} --locked-mode

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore /p:ContinuousIntegrationBuild=true

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build DocFX site
        run: dotnet tool run docfx -- docs/docfx.json --warningsAsErrors

      - name: Test documentation landing-page validator
        shell: pwsh
        run: ./scripts/Validate-LandingPage.ps1 -SelfTest

      - name: Validate documentation landing page
        shell: pwsh
        run: ./scripts/Validate-LandingPage.ps1 -SiteDirectory ./docs/_site

      - name: Test published HTML metadata tooling
        shell: pwsh
        run: ./scripts/Ensure-PublishedHtmlMetadata.ps1 -SelfTest

      - name: Ensure published HTML metadata
        shell: pwsh
        run: ./scripts/Ensure-PublishedHtmlMetadata.ps1 -SiteDirectory ./docs/_site

      - name: Validate publication locally
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --root-dir "${{ github.workspace }}"
            --exclude "^https://github[.]com/AsiBackbone/ReferenceApplication/blob/[0-9]+/merge/"
            --remap "^https://asibackbone\.github\.io/ReferenceApplication/$ file://${{ github.workspace }}/docs/_site/index.html"
            --remap "^https://asibackbone\.github\.io/ReferenceApplication/(.*)$ file://${{ github.workspace }}/docs/_site/\$1"
            --remap "^https://github\.com/AsiBackbone/ReferenceApplication/blob/main/(.*)/#L[0-9]+$ file://${{ github.workspace }}/\$1"
            --remap "^https://github\.com/AsiBackbone/ReferenceApplication/blob/main file://${{ github.workspace }}"
            './*.md'
            './docs/_site/**/*.html'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
          jobSummary: true
      - name: Validate publication and external links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir "${{ github.workspace }}"
            --remap "^https://asibackbone\.github\.io/ReferenceApplication/$ file://${{ github.workspace }}/docs/_site/index.html"
            --remap "^https://asibackbone\.github\.io/ReferenceApplication/(.*)$ file://${{ github.workspace }}/docs/_site/\$1"
            --remap "^https://github\.com/AsiBackbone/ReferenceApplication/blob/main/(.*)/#L[0-9]+$ file://${{ github.workspace }}/\$1"
            --remap "^https://github\.com/AsiBackbone/ReferenceApplication/blob/main file://${{ github.workspace }}"
            './*.md'
            './docs/_site/**/*.html'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
          jobSummary: true

      # Zenodo DOIs are excluded from Lychee (see lychee.toml) and resolved here
      # instead. Scheduled and manual runs fail when a DOI does not resolve after
      # retries, so an archive that disappears is still reported as link rot.
      # Pull request and push runs only warn, because Zenodo intermittently times
      # out or returns HTTP 500 to automated requests, and that says nothing
      # about the change under review.
      - name: Resolve Zenodo archive DOIs
        if: ${{ !cancelled() }}
        shell: bash
        env:
          STRICT: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          mapfile -t dois < <(grep -rhoE 'https://doi\.org/10\.5281/zenodo\.[0-9]+' \
            --include='*.md' --exclude-dir='.link-targets' . | sort -u)
          if [[ ${#dois[@]} -eq 0 ]]; then
            echo "::error::No Zenodo DOI links were found in Markdown; update this step if the archive links moved."
            exit 1
          fi

          unresolved=0
          for doi in "${dois[@]}"; do
            status=""
            if status="$(curl --silent --show-error --fail --location \
                --output /dev/null --write-out '%{http_code}' \
                --connect-timeout 10 --max-time 30 \
                --retry 4 --retry-delay 15 --retry-all-errors \
                --user-agent 'AsiBackbone-ReferenceApplication-link-validation (+https://github.com/AsiBackbone/ReferenceApplication)' \
                "$doi")"; then
              echo "Resolved $doi (HTTP $status)."
              continue
            fi

            unresolved=$((unresolved + 1))
            if [[ "$STRICT" == "true" ]]; then
              echo "::error::$doi did not resolve after retries (last HTTP status ${status:-none})."
            else
              echo "::warning::$doi did not resolve after retries (last HTTP status ${status:-none}). Not failing this ${GITHUB_EVENT_NAME} run; the weekly scheduled run reports a DOI that stays unavailable."
            fi
          done

          if [[ "$unresolved" -gt 0 && "$STRICT" == "true" ]]; then
            exit 1
          fi
          echo "Checked ${#dois[@]} Zenodo DOI(s); ${unresolved} unresolved."
