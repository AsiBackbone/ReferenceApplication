name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Deny all token permissions unless granted by a job.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: Release
  SOLUTION_FILE: './ReferenceApplication.slnx'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }} --locked-mode

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore /p:ContinuousIntegrationBuild=true

      - name: Verify formatting
        run: dotnet format ${{ env.SOLUTION_FILE }} --verify-no-changes --no-restore --verbosity minimal

      - name: Test
        run: dotnet test ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-build /p:ContinuousIntegrationBuild=true

  container-smoke-test:
    name: Container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build images
        run: docker compose build

      # The runtime image must stay minimal: a non-root user, no SDK, and no migration bundle, which ships only in the
      # opt-in migrations image.
      - name: Inspect runtime image
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' referenceapplication-web:dev)"
          echo "Runtime image user: ${user:-<unset>}"
          test -n "$user" && test "$user" != "root" && test "$user" != "0"
          docker run --rm --entrypoint /bin/sh referenceapplication-web:dev -c \
            'test "$(id -u)" != "0" && test ! -e /usr/share/dotnet/sdk && test ! -e /app/efbundle && test -f /app/ReferenceApplication.Web.dll'
          docker run --rm --entrypoint /bin/sh referenceapplication-migrations:dev -c \
            'test "$(id -u)" != "0" && test -x /app/efbundle'

      - name: Migrate and serve ApplicationDatabase
        env:
          REFERENCEAPPLICATION_DEMOIDENTITY_ENABLED: 'false'
        run: |
          docker compose up --detach
          test "$(docker inspect --format '{{.State.ExitCode}}' referenceapplication-migrations)" = "0"
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/health/ready

      - name: Re-apply migrations idempotently
        run: docker compose run --rm referenceapplication.migrations

      - name: Serve the Development demonstration database
        run: |
          docker compose up --detach --force-recreate --no-deps referenceapplication.web
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/health/ready

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Remove containers and volumes
        if: always()
        run: docker compose down --volumes

  codeql-actions:
    name: CodeQL analysis (actions, none)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize CodeQL for GitHub Actions
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Actions analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  codeql-csharp:
    name: CodeQL analysis (csharp, manual)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Initialize CodeQL for C#
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: csharp
          build-mode: manual

      - name: Restore for CodeQL
        run: dotnet restore ${{ env.SOLUTION_FILE }} --locked-mode

      - name: Build for CodeQL
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore /p:ContinuousIntegrationBuild=true

      - name: Perform CodeQL C# analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
