# This workflow uses actions that are not certified by GitHub. They are provided
# by third parties and governed by separate terms, privacy policies, and support.
# OWASP Dependency-Check scans the restored NuGet graph, blocks high-severity
# findings on pull requests, and uploads SARIF results to code scanning.

name: OWASP Dependency-Check software composition analysis

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  schedule:
    - cron: '30 9 * * 0'
  workflow_dispatch:

# Deny all token permissions unless granted by a job.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-check:
    name: Analyze dependencies with OWASP Dependency-Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Restore so the full transitive dependency graph (obj/project.assets.json)
      # is available for Dependency-Check's NuGet analyzers to read.
      - name: Restore dependencies
        run: dotnet restore ./ReferenceApplication.slnx --locked-mode

      - name: Run OWASP Dependency-Check (fail on CVSS 7 or higher)
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            owasp/dependency-check-action@sha256:5dba1047835a50d51e5819fb912d3ed4037076f665cbff284ccdcd5953fa3d0c \
            --project AsiBackbone \
            --scan /src \
            --format ALL \
            --out /src/reports \
            --noupdate \
            --failOnCVSS 7 \
            --suppression /src/dependency-check-suppressions.xml

      - name: Upload report artifact
        if: ${{ always() && hashFiles('reports/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 5

      - name: Upload results to code scanning
        if: ${{ always() && hashFiles('reports/dependency-check-report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: owasp-dependency-check
