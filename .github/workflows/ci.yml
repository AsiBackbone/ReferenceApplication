name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Deny all token permissions unless granted by a job.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: Release
  SOLUTION_FILE: './ReferenceApplication.slnx'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }} --locked-mode

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore /p:ContinuousIntegrationBuild=true

      - name: Verify formatting
        run: dotnet format ${{ env.SOLUTION_FILE }} --verify-no-changes --no-restore --verbosity minimal

      # Coverage is reported, not gated. Generated EF Core migrations are excluded; coverlet's defaults exclude the
      # test assembly and compiler-generated code.
      - name: Test with coverage
        run: >-
          dotnet test ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-build
          --results-directory TestResults/coverage
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-exclude-by-file "**/Migrations/*.cs"
          /p:ContinuousIntegrationBuild=true

      - name: Summarize coverage
        shell: pwsh
        run: ./scripts/Write-CoverageSummary.ps1 -ReportDirectory TestResults/coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: TestResults/coverage/coverage.cobertura*.xml
          if-no-files-found: error
          retention-days: 14

  container-smoke-test:
    name: Container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build images
        run: docker compose build

      # The runtime image must stay minimal: a non-root user, no SDK, and no migration bundle, which ships only in the
      # opt-in migrations image.
      - name: Inspect runtime image
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' referenceapplication-web:dev)"
          echo "Runtime image user: ${user:-<unset>}"
          test -n "$user" && test "$user" != "root" && test "$user" != "0"
          docker run --rm --entrypoint /bin/sh referenceapplication-web:dev -c \
            'test "$(id -u)" != "0" && test ! -e /usr/share/dotnet/sdk && test ! -e /app/efbundle && test -f /app/ReferenceApplication.Web.dll'
          docker run --rm --entrypoint /bin/sh referenceapplication-migrations:dev -c \
            'test "$(id -u)" != "0" && test -x /app/efbundle'

      - name: Migrate and serve ApplicationDatabase
        env:
          REFERENCEAPPLICATION_DEMOIDENTITY_ENABLED: 'false'
        run: |
          docker compose up --detach
          test "$(docker inspect --format '{{.State.ExitCode}}' referenceapplication-migrations)" = "0"
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/health/ready

      - name: Re-apply migrations idempotently
        run: docker compose run --rm referenceapplication.migrations

      - name: Serve the Development demonstration database
        run: |
          docker compose up --detach --force-recreate --no-deps referenceapplication.web
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/health/ready
          # The startup posture line reports the host's own registrations; in Development the demo identity is one.
          docker compose logs --no-color referenceapplication.web \
            | grep --fixed-strings 'Security posture: Development-only components are registered: demo identity'

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Remove containers and volumes
        if: always()
        run: docker compose down --volumes

      # Production-shaped pass (#72): docker-compose.production.yml on top of the base file. Every required secret is a
      # throwaway generated here, kept in the runner's temporary directory, and never committed or uploaded.
      - name: Prepare test-only Production secrets
        run: |
          secrets="$RUNNER_TEMP/production-secrets"
          mkdir -p "$secrets"
          certificate_password="$(openssl rand -hex 24)"
          client_secret="$(openssl rand -hex 24)"
          echo "::add-mask::$certificate_password"
          echo "::add-mask::$client_secret"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj '/CN=ReferenceApplication CI Data Protection' \
            -keyout "$secrets/key.pem" -out "$secrets/certificate.pem"
          openssl pkcs12 -export -inkey "$secrets/key.pem" -in "$secrets/certificate.pem" \
            -out "$secrets/dataprotection.pfx" -passout "pass:$certificate_password"
          rm "$secrets/key.pem"
          # Compose bind-mounts file secrets outside Swarm, so the non-root container user must be able to read it.
          chmod 0444 "$secrets/dataprotection.pfx"
          {
            echo "REFERENCEAPPLICATION_ALLOWEDHOSTS=localhost"
            echo "REFERENCEAPPLICATION_FORWARDEDHEADERS_KNOWNNETWORK=172.31.250.0/24"
            echo "REFERENCEAPPLICATION_DATAPROTECTION_CERTIFICATE_FILE=$secrets/dataprotection.pfx"
            echo "REFERENCEAPPLICATION_DATAPROTECTION_CERTIFICATE_PASSWORD=$certificate_password"
            # The provider is never contacted: no sign-in is attempted, and metadata is fetched only on a challenge.
            echo "REFERENCEAPPLICATION_OIDC_AUTHORITY=https://identity.example.invalid"
            echo "REFERENCEAPPLICATION_OIDC_CLIENTID=referenceapplication-ci"
            echo "REFERENCEAPPLICATION_OIDC_CLIENTSECRET=$client_secret"
          } > "$secrets/production.env"

      - name: Migrate and serve in Production
        run: |
          compose=(docker compose --env-file "$RUNNER_TEMP/production-secrets/production.env" \
            -f docker-compose.yml -f docker-compose.production.yml)
          "${compose[@]}" up --build --detach
          test "$(docker inspect --format '{{.State.ExitCode}}' referenceapplication-migrations)" = "0"
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/health/ready

      - name: Verify the Production posture
        run: |
          compose=(docker compose --env-file "$RUNNER_TEMP/production-secrets/production.env" \
            -f docker-compose.yml -f docker-compose.production.yml)
          logs="$("${compose[@]}" logs --no-color referenceapplication.web)"

          # `! grep` would not fail the step under `bash -e`, so absence is checked explicitly.
          refuse() {
            if grep --quiet --fixed-strings "$1" <<< "$2"; then
              echo "::error::Unexpected in the Production pass: $1"
              exit 1
            fi
          }

          # Running as Production, with no Development-only component registered in the host's service provider.
          grep --fixed-strings 'anonymous access in Production' <<< "$logs"
          grep --fixed-strings 'Security posture: no Development-only components are registered.' <<< "$logs"
          refuse 'Development-only demo identity controls are active' "$logs"

          # Explicit host and proxy trust, and an encrypted, durable key ring: none of the relaxed-posture warnings.
          refuse 'allows every host' "$logs"
          refuse 'is stored under the application content root' "$logs"
          refuse 'key-ring files are not encrypted' "$logs"

          # Host filtering rejects a Host header outside AllowedHosts.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/health/live)" = "400"

          # Sign-in offers the configured external provider and no demo identity.
          login="$(curl --fail --silent --show-error http://localhost:8080/Account/Login)"
          grep --fixed-strings 'OpenID Connect' <<< "$login"
          refuse '/Account/DemoSignIn' "$login"

          # The sign-in page issued an antiforgery token, so the key ring holds a key, encrypted with the certificate.
          docker exec referenceapplication-web sh -c 'grep -l encryptedSecret /app/data-protection-keys/key-*.xml'

      - name: Show Production container logs
        if: failure()
        run: |
          docker compose --env-file "$RUNNER_TEMP/production-secrets/production.env" \
            -f docker-compose.yml -f docker-compose.production.yml logs --no-color

      - name: Remove Production containers, volumes, and secrets
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/production-secrets/production.env" ]; then
            docker compose --env-file "$RUNNER_TEMP/production-secrets/production.env" \
              -f docker-compose.yml -f docker-compose.production.yml down --volumes
          fi
          rm -rf "$RUNNER_TEMP/production-secrets"

  codeql-actions:
    name: CodeQL analysis (actions, none)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize CodeQL for GitHub Actions
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Actions analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  codeql-csharp:
    name: CodeQL analysis (csharp, manual)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Initialize CodeQL for C#
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: csharp
          build-mode: manual

      - name: Restore for CodeQL
        run: dotnet restore ${{ env.SOLUTION_FILE }} --locked-mode

      - name: Build for CodeQL
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore /p:ContinuousIntegrationBuild=true

      - name: Perform CodeQL C# analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
