name: Governance Benchmarks

on:
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:

# Deny all token permissions unless granted by the job.
permissions: {}

concurrency:
  group: governance-benchmarks-${{ github.ref }}
  cancel-in-progress: false

env:
  BENCHMARK_PROJECT: './tests/ReferenceApplication.Benchmarks/ReferenceApplication.Benchmarks.csproj'
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  benchmark:
    name: Measure host governance overhead
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore benchmark
        run: dotnet restore ${{ env.BENCHMARK_PROJECT }} --locked-mode

      - name: Build benchmark
        run: dotnet build ${{ env.BENCHMARK_PROJECT }} --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Run benchmarks
        run: dotnet run --project ${{ env.BENCHMARK_PROJECT }} --configuration Release --no-build -- --filter '*'

      - name: Record benchmark provenance
        shell: pwsh
        run: |
          [xml]$packages = Get-Content -Raw 'Directory.Packages.props'
          $versions = @(
            $packages.Project.ItemGroup.PackageVersion |
              Where-Object { $_.Include -like 'AsiBackbone.*' } |
              ForEach-Object { [string]$_.Version } |
              Sort-Object -Unique
          )

          if ($versions.Count -ne 1) {
            throw "Expected one AsiBackbone package version, found: $($versions -join ', ')"
          }

          $artifactDirectory = Join-Path $PWD 'BenchmarkDotNet.Artifacts'
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null

          @(
            '# Governance benchmark provenance'
            ''
            "| Field | Value |"
            "| --- | --- |"
            "| Repository commit | ``$env:GITHUB_SHA`` |"
            "| Repository ref | ``$env:GITHUB_REF`` |"
            "| AsiBackbone version | ``$($versions[0])`` |"
            "| Workflow run | ``$env:GITHUB_RUN_ID`` |"
          ) | Set-Content -Path (Join-Path $artifactDirectory 'benchmark-provenance.md')

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: governance-benchmark-results-${{ github.run_id }}
          path: BenchmarkDotNet.Artifacts
          if-no-files-found: error
          retention-days: 30
