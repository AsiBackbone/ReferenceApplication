# This workflow uses third-party actions governed by their own terms of service,
# privacy policies, and support documentation.

name: GitHub Actions security analysis

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '15 9 * * 0'
  workflow_dispatch:

# Deny all token permissions unless granted by a job.
permissions: {}

jobs:
  zizmor:
    name: Analyze workflows with zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze workflows
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: .
          online-audits: true
          persona: regular
          version: v1.26.1
          advanced-security: true

  actionlint:
    name: Validate workflows with actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color
